<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Afirmação do Dia</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:transparent;
    padding:10px;
    font-family:Arial, Helvetica, sans-serif;
}

.card{

    width:100%;

    background:linear-gradient(
        135deg,
        #ffd194 0%,
        #ffb347 40%,
        #ff8c42 75%,
        #ff6b35 100%
    );

    border-radius:24px;

    padding:24px;

    text-align:center;

    box-shadow:
        0 10px 30px rgba(0,0,0,.18);

}

.quote-mark{

    font-size:48px;

    color:rgba(255,255,255,.7);

    line-height:1;

    margin-bottom:10px;
}

.quote{

    color:#2c2c2c;

    font-size:32px;

    font-weight:500;

    line-height:1.4;

    margin-bottom:20px;
}

button{

    background:#c75a00;

    color:white;

    border:none;

    border-radius:12px;

    padding:12px 24px;

    font-size:14px;

    font-weight:bold;

    cursor:pointer;

    transition:.2s;
}

button:hover{

    background:#a84b00;
}

.loading{
    opacity:.6;
}

@media(max-width:700px){

    .quote{
        font-size:22px;
    }

}

</style>
</head>

<body>

<div class="card">

    <div class="quote-mark">❝</div>

    <div id="quote" class="quote loading">
        Carregando afirmação...
    </div>

    <button onclick="loadAffirmation()">
        Nova Afirmação
    </button>

</div>

<script>

const fallback = [

"Eu sou capaz de alcançar meus objetivos.",
"Cada dia me torna mais forte.",
"Minha disciplina cria meu futuro.",
"Eu mereço prosperar.",
"Meu potencial é ilimitado.",
"Tenho coragem para agir.",
"Meu foco gera resultados.",
"Estou evoluindo todos os dias.",
"Cada pequeno passo importa.",
"Posso melhorar um pouco todos os dias."

];

async function loadAffirmation(){

    const quote =
        document.getElementById("quote");

    quote.classList.add("loading");
    quote.innerText =
        "Carregando afirmação...";

    try{

        const response =
            await fetch(
                "https://motivacional.top/api.php?acao=aleatoria&_=" +
                Date.now()
            );

        const text =
            await response.text();

        quote.innerText =
            text.replace(/<[^>]*>/g,"").trim();

    }catch{

        quote.innerText =
            fallback[
                Math.floor(
                    Math.random() *
                    fallback.length
                )
            ];
    }

    quote.classList.remove("loading");
}

loadAffirmation();

</script>

</body>
</html>
