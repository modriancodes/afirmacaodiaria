<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Afirmação do Dia</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:12px;
    font-family:Inter,Segoe UI,Arial,sans-serif;
    background:transparent;
}

.card{

    width:100%;
    max-width:1400px;

    margin:auto;

    background:
        linear-gradient(
            180deg,
            #ffd7a8 0%,
            #ffbc72 50%,
            #ff9550 100%
        );

    border-radius:22px;

    padding:22px 40px;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    box-shadow:
        0 10px 35px rgba(0,0,0,.12);

    position:relative;
    overflow:hidden;
}

/* brilho suave do céu */
.card::before{

    content:"";

    position:absolute;

    top:-120px;
    left:50%;

    transform:translateX(-50%);

    width:500px;
    height:250px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(255,255,255,.35) 0%,
            rgba(255,255,255,0) 70%
        );

    pointer-events:none;
}

.quote-mark{

    font-size:52px;

    color:rgba(128,69,20,.75);

    line-height:1;

    margin-bottom:8px;

    z-index:2;
}

.quote{

    width:100%;

    text-align:center;

    font-size:1.65rem;
    font-weight:500;

    color:#2f2f2f;

    line-height:1.4;

    margin-bottom:20px;

    z-index:2;
}

.loading{
    opacity:.6;
}

button{

    background:#d66a11;

    color:white;

    border:none;

    border-radius:12px;

    padding:12px 24px;

    font-size:14px;
    font-weight:700;

    cursor:pointer;

    transition:.2s;

    z-index:2;
}

button:hover{

    background:#b85a0d;

    transform:translateY(-2px);
}

button:active{

    transform:translateY(1px);
}

/* responsivo */

@media(max-width:900px){

    .card{
        padding:20px;
    }

    .quote{
        font-size:1.2rem;
    }
}

</style>
</head>

<body>

<div class="card">

    <div class="quote-mark">❝</div>

    <div id="quote" class="quote loading">
        Carregando afirmação...
    </div>

    <button onclick="loadAffirmation()">
        Nova Afirmação
    </button>

</div>

<script>

const fallback = [

"Eu sou capaz de alcançar meus objetivos.",
"Cada dia me torna mais forte.",
"Minha disciplina cria meu futuro.",
"Eu mereço prosperar.",
"Meu potencial é ilimitado.",
"Tudo o que preciso para avançar já está dentro de mim.",
"Estou evoluindo todos os dias.",
"Eu confio no processo da minha jornada.",
"Tenho coragem para agir.",
"Sou resiliente diante dos desafios.",
"Meu foco gera resultados.",
"Minha energia está alinhada com meus objetivos.",
"Posso aprender qualquer coisa com dedicação.",
"Meu crescimento acontece constantemente.",
"Sou capaz de criar a vida que desejo.",
"Cada pequeno passo importa.",
"Tenho valor e propósito.",
"Acredito em mim mesmo.",
"Estou preparado para novas oportunidades.",
"Minha determinação supera qualquer obstáculo."

];

async function loadAffirmation(){

    const quote =
        document.getElementById("quote");

    quote.classList.add("loading");
    quote.innerText = "Carregando afirmação...";

    try{

        const response =
            await fetch(
                "https://motivacional.top/api.php?acao=aleatoria&_=" +
                Date.now()
            );

        const text =
            await response.text();

        let frase = text;

        try{

            const json =
                JSON.parse(text);

            frase =
                json.frase ||
                json.texto ||
                json.mensagem ||
                json.quote ||
                text;

        }catch(e){}

        frase = frase
            .replace(/<[^>]*>/g,"")
            .trim();

        if(frase.length < 3){
            throw new Error();
        }

        quote.innerText = frase;

    }catch(e){

        const random =
            fallback[
                Math.floor(
                    Math.random() *
                    fallback.length
                )
            ];

        quote.innerText = random;
    }

    quote.classList.remove("loading");
}

loadAffirmation();

</script>

</body>
</html>
