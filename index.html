<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Afirmação do Dia</title>

<script src="frases.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

padding:10px;
font-family:Inter,Arial,sans-serif;
background:transparent;

}

.card{

width:100%;

padding:24px;

border-radius:24px;

text-align:center;

background:
linear-gradient(
135deg,
#ffd194 0%,
#ffb347 45%,
#ff944d 75%,
#ff6b35 100%
);

box-shadow:
0 10px 30px rgba(0,0,0,.15);

}

.quote-mark{

font-size:52px;
line-height:1;

color:
rgba(255,255,255,.75);

margin-bottom:8px;

}

.quote{

font-size:32px;
font-weight:500;

line-height:1.45;

color:#2f2f2f;

margin-bottom:12px;

transition:.3s ease;

}


.category{

font-size:14px;

font-weight:700;

letter-spacing:1px;

text-transform:uppercase;

color:
rgba(0,0,0,.55);

margin-bottom:20px;

}


.loading{

opacity:.65;

}


button{

border:none;

background:#c75a00;

color:white;

padding:12px 24px;

border-radius:12px;

font-size:14px;

font-weight:700;

cursor:pointer;

transition:.2s;

}


button:hover{

background:#a84b00;

transform:translateY(-2px);

}


button:active{

transform:translateY(1px);

}


@media(max-width:700px){

.quote{

font-size:22px;

}

}

</style>

</head>

<body>


<div class="card">

<div class="quote-mark">

❝

</div>


<div id="quote" class="quote">

Carregando afirmação...

</div>


<div id="category" class="category">

&nbsp;

</div>


<button onclick="novaAfirmacao()">

Nova Afirmação

</button>


</div>



<script>


const STORAGE_FRASE_ATUAL = "fraseAtual";

const STORAGE_INDICE_ATUAL = "indiceAtual";

const STORAGE_UTILIZADAS = "frasesUtilizadas";




function carregarUtilizadas(){

const utilizadas =

localStorage.getItem(
STORAGE_UTILIZADAS
);

return utilizadas
? JSON.parse(utilizadas)
: [];

}



function salvarUtilizadas(lista){

localStorage.setItem(

STORAGE_UTILIZADAS,

JSON.stringify(lista)

);

}



function salvarIndiceAtual(indice){

localStorage.setItem(

STORAGE_INDICE_ATUAL,

indice

);

}


function carregarIndiceAtual(){

return localStorage.getItem(
STORAGE_INDICE_ATUAL
);

}



function obterNovoIndice(){


if(

typeof AFIRMACOES === "undefined"

||

AFIRMACOES.length === 0

){

return null;

}


let utilizadas =
carregarUtilizadas();


if(

utilizadas.length >=
AFIRMACOES.length

){

utilizadas = [];

salvarUtilizadas([]);

}



let disponiveis = [];


for(

let i=0;

i<AFIRMACOES.length;

i++

){

if(

!utilizadas.includes(i)

){

disponiveis.push(i);

}

}



const indiceAleatorio =

Math.floor(

Math.random() *

disponiveis.length

);


const indiceEscolhido =

disponiveis[
indiceAleatorio
];


utilizadas.push(
indiceEscolhido
);


salvarUtilizadas(
utilizadas
);


salvarIndiceAtual(
indiceEscolhido
);


return indiceEscolhido;


}



function exibirFrase(indice){


const frase =

AFIRMACOES[indice];


if(!frase){

return;

}


const quote =

document.getElementById(
"quote"
);


const category =

document.getElementById(
"category"
);



quote.style.opacity = .4;
category.style.opacity = .4;



setTimeout(()=>{


quote.innerText =
frase.texto;


category.innerText =
frase.categoria;



quote.style.opacity = 1;
category.style.opacity = 1;


},150);


}



function carregarWidget(){


if(

typeof AFIRMACOES === "undefined"

||

AFIRMACOES.length === 0

){

document.getElementById(
"quote"
).innerText =

"Erro ao carregar o arquivo frases.js.";

return;

}



let indiceAtual =

carregarIndiceAtual();



if(

indiceAtual === null

||

indiceAtual === ""

){

indiceAtual =
obterNovoIndice();

}


exibirFrase(
Number(indiceAtual)
);


}



function novaAfirmacao(){


const indice =

obterNovoIndice();


exibirFrase(
indice
);


}



carregarWidget();


</script>

</body>

</html>
